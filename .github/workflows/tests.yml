name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: CLANG64
          install: mingw-w64-clang-x86_64-clang
      - name: Put clang on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\clang64\bin"
      - name: Run unit tests
        shell: pwsh
        run: ./tests/run.ps1
